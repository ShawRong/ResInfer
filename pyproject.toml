# To install:
#   source ./env.sh
#   uv sync                      # main runtime/eval venv (vLLM + lm-eval)
#   ./setup-export-venv.sh       # standalone env-export/.venv for FP4 export
#
# Architecture: dual-venv setup
#   - Main .venv: vLLM runtime/eval. It does not own ModelOpt
#     calibration/export dependencies.
#   - env-export/.venv: ModelOpt calibration/export env, versioned separately
#     because TRT-LLM has its own torch ABI and ModelOpt dependency constraints.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resinfer"
version = "0.1.0"
description = "Residue-compensated NVFP4 calibration, export, and vLLM serving"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # ── Torch (cu130 for Blackwell sm_100 / sm_120: B200, RTX 5090) ──────
    "torch==2.11.0",
    "torchvision==0.26.0+cu130",
    "torchaudio==2.11.0",

    # ── Runtime quantization support ─────────────────────────────────────
    # Export/calibration ModelOpt is managed separately in env-export/.
    "torch-c-dlpack-ext>=0.1.5",
    "nvfp4",                              # local CUDA kernel (csrc/nvfp4)

    # ── HF / data stack ──────────────────────────────────────────────────
    # vLLM nightly requires Transformers 5.x.  Some lm-eval imports still
    # reference removed 4.x VLM auto classes; dev/evaluation/eval_vllm.py
    # installs a small compatibility shim for non-VLM evaluations.
    "transformers>=5.5.3",
    "accelerate>=0.21.0",
    "datasets>=2.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.34.4",
    "sentencepiece>=0.2.1",
    "tiktoken>=0.12.0",
    "protobuf>=6.33.1",

    # ── Eval stack (vllm + lm-eval) ──────────────────────────────────────
    "vllm==0.26.0",
    "flashinfer-python==0.6.14",
    # flashinfer-cubin is deliberately NOT pinned: flashinfer enforces an
    # EXACT cubin/python version match and the cubin package lags (latest
    # 0.6.13 vs flashinfer-python 0.6.14), so installing it makes
    # `import flashinfer` raise. Without it flashinfer fetches/JITs cubins
    # on demand, which is verified working (nvfp4_quantize smoke).
    "xgrammar>=0.2.1,<1.0.0",             # vllm structured-output backend
    "mistral-common[image]>=1.11.3",      # vllm tokenizer / multimodal dep
    "ray>=2.53.0",
    "cloudpickle>=2.0.0",
    "lm-eval[longbench,ruler,math]>=0.4.9.2",
    "rouge>=1.0.1",

    # ── PD-disaggregated KV transfer (NIXL) ──────────────────────────────
    # Required for the PD eval / sweep workflow. vllm main does
    # not declare nixl as a hard dep, so we pin it explicitly here.
    "nixl==1.1.0",
    "nixl-cu13==1.1.0",                   # CUDA 13 backend for nixl

    # ── Profiling / timing ────────────────────────────────────────────────
    "cupti-python==13.2.0",               # used by flashinfer bench + nsys timing harnesses

    # ── CUTLASS runtime (also pulled by vllm; pin to match) ──────────────
    "nvidia-cutlass-dsl[cu13]==4.6.0",

    # ── Misc utilities ───────────────────────────────────────────────────
    "numpy>=2.0.0,<3.0.0",
    "scipy>=1.10.0",
    "einops>=0.6.0",
    "fairscale>=0.4.0",
    "tqdm>=4.64.0",
    "requests>=2.32.5",
    "modal>=1.3.5",
    "setuptools>=77",
    "wheel>=0.45",

    # ── Plotting / analysis utilities ────────────────────────────────────
    "matplotlib>=3.10",
    "pandas>=2.3",

    # ── NVIDIA CUDA runtime libraries ────────────────────────────────────
    # torch cu130 packages pull cu13 stubs (no .so files); these cu12 pkgs
    # provide the actual libcudnn.so.9 / libnccl.so.2 etc. at runtime.
    "nvidia-cudnn-cu12==9.19.1.2",
    "nvidia-nccl-cu12>=2.20",
    "nvidia-cusparselt-cu12>=0.6",
    "nvidia-nvshmem-cu12>=3.0",
    "nvidia-cublas-cu12>=12.0",
]

[tool.setuptools.packages.find]
include = [
    "auto_search",
    "auto_search.*",
    "dev",
    "dev.*",
    "quant",
    "quant.*",
]
exclude = [
    "csrc",
    "csrc.*",
    "configs",
    "configs.*",
    "docs",
    "docs.*",
    "env-export",
    "env-export.*",
    "patches",
    "patches.*",
    "tests",
    "tests.*",
]

# Optional PyPI mirror for users in China.  It is explicit so the public
# default remains PyPI unless a package source opts into this mirror.
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
explicit = true

# PyTorch CUDA 13.0 index (for RTX 5090 support - only for torch packages)
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# NVIDIA package index for CUDA-adjacent wheels that are not published on PyPI.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

# vLLM CUDA 13 nightly wheels. Pinned in [project.dependencies] so lockfiles
# remain tied to a specific dev wheel even though this index advances.
[[tool.uv.index]]
name = "vllm-nightly-cu130"
url = "https://wheels.vllm.ai/nightly/cu130"
explicit = true

# Specify which index to use for PyTorch packages, and local path packages
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
nvfp4 = { path = "csrc/nvfp4", editable = true }
vllm = { url = "https://wheels.vllm.ai/b5a2adec4bae0032c00e974b391e04ce59b98242/vllm-0.23.1rc1.dev260%2Bgb5a2adec4-cp38-abi3-manylinux_2_28_x86_64.whl" }
nixl = { index = "nvidia" }
nixl-cu13 = { index = "nvidia" }
nvidia-cudnn-cu12 = { index = "nvidia" }

# nvfp4 uses torch.utils.cpp_extension which requires torch at build time;
# disable build isolation so the venv's torch is visible during compilation.
[tool.uv]
no-build-isolation-package = ["nvfp4"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Dependency overrides for cu13 + nightly vllm coexistence:
# cupti-python 13.2.0 declares `nvidia-cuda-cupti>=13.2` but torch 2.11.0+cu130
# transitively pins `nvidia-cuda-cupti==13.0.85.*`. Both work fine together at
# runtime (the working venv has them coexisting), but uv's strict resolver
# rejects the metadata conflict. We override cupti-python's claim so the
# resolver accepts the working combination.
override-dependencies = [
    "nvidia-cuda-cupti==13.0.85",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]
