# Checkpoint paths are relative to --models-root. See benchmarks/README.md.
name: speed_dense

kernel:
  models: [qwen3_4b, qwen3_8b, qwen3_14b, qwen3_32b, qwen35_27b]
  families:
    mext:
      m_grid: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
      m_max_by_arch: {sm100: 512, sm103: 512, sm120: 128}

    kext:
      ratios: [0.125, 0.25, 0.5, 1.0]
      m_grid: [128, 256, 512, 1024, 2048]
      m_min_by_arch: {sm100: 256, sm103: 256, sm120: 128}

  repeats: 5

e2e:
  workload:
    input_len: 1024
    output_len: 256
    ignore_eos: true          # fixes the token count so arms do equal work
    request_rate: inf         # saturation; concurrency is the load knob
    dataset: random

  concurrencies: [1, 4, 16, 64]

  rounds: 8
  rotate_arms: true

  ready_timeout_s: 5400

arms:
  - id: bf16
    kind: bf16
    path: base_bf16
    role: ceiling
  - id: plain
    kind: modelopt_fp4
    path: plain_nvfp4
    role: floor
  - id: b425
    kind: residue
    path: b425
    bits: 4.25
  - id: b55
    kind: residue
    path: b55
    bits: 5.50
  - id: b70
    kind: residue
    path: b70
    bits: 7.00
  - id: b80
    kind: residue
    path: b80
    bits: 8.00

hygiene:
  env:
    VLLM_DISABLE_COMPILE_CACHE: "1"
    RESIDUE_TENSOR_DUMP: "<unset>"
