# Standalone uv project for the FP4 export / calibration venv.
#
# Lives at env-export/. Provisioned by:
#
#     uv sync --project env-export
#     ./setup-export-venv.sh   # adds nvfp4 (needs --no-build-isolation)
#
# Why a separate venv:
#   The main .venv runs vLLM/lm-eval runtime and may keep a ModelOpt runtime
#   dependency for loading ModelOpt checkpoints. Do not use it for export.
#   This venv owns ModelOpt versioning for calibration and FP4 export.
#   Latest TRT-LLM (1.3.0rc11) pins old modelopt and incompatible torch ABI,
#   so we lock TRT-LLM to 1.1.0 and pin a public ModelOpt pre-release here.
#
# Dep resolution trick: TRT-LLM 1.1.0 declares `nvidia-modelopt[torch]~=0.37`,
# which conflicts with the export ModelOpt pin. Instead of installing with --no-deps
# and manually listing transitive deps (tensorrt, blake3, flashinfer, ...),
# we use [[tool.uv.dependency-metadata]] to override TRT-LLM's requires-dist
# and strip just the modelopt pin. uv then resolves everything cleanly.

[project]
name = "resinfer-export"
version = "0.1.0"
description = "ResInfer FP4 export venv (ModelOpt 0.45.0rc1 + TRT-LLM 1.1.0 + torch 2.9 cu130)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── Torch (cu130 for Blackwell sm_100/sm_120, ABI-compat with TRT-LLM 1.1.0) ─
    "torch==2.9.0",
    "torchvision==0.24.0",
    "torchaudio==2.9.0",

    # ── ModelOpt — export/calibration dependency managed only in this venv ──
    # (torch is a baseline dep of modelopt, not an extra — bracket `[torch]`
    # was an old typo that uv silently ignored. Removed for cleanliness.)
    "nvidia-modelopt==0.45.0rc1",

    # ── TRT-LLM 1.1.0 — see [[tool.uv.dependency-metadata]] below for the
    #    modelopt-pin override that makes this resolvable.
    "tensorrt-llm==1.1.0",

    # ── HuggingFace + calibration data stack ─────────────────────────────
    # (TRT-LLM pins transformers==4.56.0 and datasets==3.1.0 — we accept
    # those pins; this ModelOpt pre-release is compatible.)
    "transformers>=4.21.0",
    "accelerate>=0.21.0",
    "datasets>=2.0.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.34.4",
    "sentencepiece>=0.2.1",
    "tiktoken>=0.12.0",
    "protobuf>=6.33.1",

    # ── Misc utilities used by calibration / export ──────────────────────
    "numpy>=2.0.0,<3.0.0",
    "scipy>=1.10.0",
    "einops>=0.6.0",
    "rouge>=1.0.1",
    "tqdm>=4.64.0",
]

# ── Indexes ──────────────────────────────────────────────────────────────
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# TRT-LLM is only published on the NVIDIA index.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

# ── Source bindings ──────────────────────────────────────────────────────
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
tensorrt-llm = { index = "nvidia" }
nvidia-modelopt = { index = "nvidia" }

# ModelOpt is normally resolved from NVIDIA's package index as
# nvidia-modelopt==0.45.0rc1.
# Development mode: uncomment below to point at a local sibling checkout.
# `uv sync --project env-export --reinstall-package nvidia-modelopt` is
# required after toggling.
# nvidia-modelopt = { path = "../TensorRT-Model-Optimizer", editable = true }

# ── Dep metadata override ────────────────────────────────────────────────
# TRT-LLM 1.1.0 declares `nvidia-modelopt[torch]~=0.37.0`, which conflicts
# with the export ModelOpt pin. We rewrite its requires-dist to drop that pin.
# Everything else is copied verbatim from the wheel's METADATA (runtime deps
# only — devel extras omitted). uv will resolve these normally.
#
# When bumping TRT-LLM, regenerate this list from the new wheel's METADATA:
#   grep '^Requires-Dist:' .venv/lib/.../tensorrt_llm-*.dist-info/METADATA
[[tool.uv.dependency-metadata]]
name = "tensorrt-llm"
version = "1.1.0"
requires-dist = [
    "accelerate>=1.7.0",
    "build",
    "colored",
    "cuda-python>=13",
    "diffusers>=0.27.0",
    "lark",
    "mpi4py",
    "numpy",  # was numpy<2 — relaxed (modelopt + torch 2.9 need numpy>=2)
    "onnx<1.20.0,>=1.18.0",
    "onnx_graphsurgeon>=0.5.2",
    "openai",
    "polygraphy",
    "psutil",
    "nvidia-ml-py>=13",
    "pulp",
    "pandas",
    "h5py==3.12.1",
    "StrEnum",
    "sentencepiece>=0.1.99",
    "tensorrt~=10.13.3",
    "torch<=2.9.0,>=2.9.0a0",
    "torchvision",
    # "nvidia-modelopt[torch]~=0.37.0",  # ← REMOVED (conflicts with export pin)
    "nvidia-nccl-cu13==2.27.7",
    "nvidia-cuda-nvrtc",
    "transformers==4.56.0",
    "prometheus_client",
    "prometheus_fastapi_instrumentator",
    "pydantic>=2.9.1",
    "pydantic-settings[yaml]",
    "omegaconf",
    "pillow",
    "wheel<=0.45.1",
    "optimum",
    "datasets==3.1.0",
    "evaluate",
    "mpmath>=1.3.0",
    "click",
    "click_option_group",
    "aenum",
    "pyzmq",
    "fastapi<=0.121.3,>=0.120.1",
    "starlette>=0.49.1",
    "uvicorn",
    "setuptools",  # was setuptools<80 — relaxed (newer modelopt needs >=80)
    "ordered-set",
    "peft",
    "patchelf",  # was patchelf==0.18.0 — yanked on PyPI
    "einops",
    "flashinfer-python<0.4.0,>=0.3.0",
    "opencv-python-headless",
    "xgrammar==0.1.25",
    "llguidance==0.7.29",
    "jsonschema",
    "backoff",
    "nvtx",
    "matplotlib",
    "meson",
    "ninja",
    "etcd3",
    "blake3",
    "soundfile",
    "triton==3.5.0; platform_machine == 'x86_64'",
    "tiktoken",
    "blobfile",
    "openai-harmony==0.0.4",
    "nvidia-cutlass-dsl==4.2.1; python_version >= '3.10'",
    "numexpr<2.14.0",
    "urllib3>=2.6.0",
]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]
